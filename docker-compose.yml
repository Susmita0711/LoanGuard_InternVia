"""docker-compose.yml
-----------------
Docker Compose configuration for LoanGuard.
It defines two services (api and frontend) that share the same image built from the Dockerfile.
Ports are read from the .env file (generated by run_local)."""
version: "3.9"
services:
  api:
    build: .
    container_name: loanguard_api
    command: uvicorn api.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8001}
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8001}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-8502}}
    ports:
      - "${BACKEND_PORT:-8001}:${BACKEND_PORT:-8001}"
    volumes:
      - .:/app
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8001}/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: .
    container_name: loanguard_frontend
    command: streamlit run dashboard/app.py --server.port ${FRONTEND_PORT:-8502} --server.headless true
    environment:
      - BACKEND_URL=http://loanguard_api:${BACKEND_PORT:-8001}
      - FRONTEND_PORT=${FRONTEND_PORT:-8502}
    ports:
      - "${FRONTEND_PORT:-8502}:${FRONTEND_PORT:-8502}"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FRONTEND_PORT:-8502}"]
      interval: 5s
      timeout: 3s
      retries: 5

